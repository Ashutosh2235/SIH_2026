# Deliberately weak Dovecot settings for the lab. DO NOT USE IN PRODUCTION.
protocols = imap pop3
listen = *

ssl = yes                          # offered, not required
ssl_cert = </etc/ssl/lab/cert.pem
ssl_key = </etc/ssl/lab/key.pem
ssl_min_protocol = TLSv1
ssl_cipher_list = ALL:@SECLEVEL=0
ssl_prefer_server_ciphers = no

disable_plaintext_auth = no        # LOGIN / USER+PASS allowed in cleartext
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%n /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=labuser gid=labuser home=/home/labuser
}
mail_location = maildir:~/Maildir

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
